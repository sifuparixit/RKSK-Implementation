<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RKSK Implementation Dashboard</title>
<style>
:root{--brand:#204898;--ink:#141b2b;--ink2:#46506a;--line:#d9e0ec;--bg:#f3f6fb;--panel:#fff;--err:#b3242b;--errbg:#fde3e3}
@media (prefers-color-scheme:dark){:root{--brand:#8fa9ee;--ink:#edf1f8;--ink2:#b6bfd2;--line:#2c3547;--bg:#0f1420;--panel:#171e2c;--err:#f6a3a0;--errbg:#46201f}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(15,25,50,.12);overflow:hidden}
.stripe{height:5px;background:linear-gradient(90deg,#204898 0 25%,#18a8e0 25% 50%,#f8a848 50% 75%,#e83434 75% 100%)}
form{padding:26px 24px 24px;display:flex;flex-direction:column;gap:12px;text-align:center}
h1{margin:0;font-size:20px;color:var(--brand);line-height:1.25}
p{margin:0;color:var(--ink2);font-size:14px}
input{font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);width:100%;margin-top:4px}
input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
button{font:inherit;font-size:15px;font-weight:600;padding:10px 12px;border:0;border-radius:6px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.err{background:var(--errbg);color:var(--err);border-radius:6px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.err button{background:transparent;color:var(--err);border:1.5px solid var(--err);padding:6px 14px;font-size:14px}
[hidden]{display:none!important}
</style></head><body>
<div class="box"><div class="stripe"></div>
<form id="f" autocomplete="off">
  <h1>RKSK Implementation Dashboard</h1>
  <p><label for="pw">Enter password to view dashboard</label></p>
  <input id="pw" type="password" autofocus required>
  <button id="go" type="submit">Unlock</button>
  <div class="err" id="err" role="alert" hidden><span>Wrong password. Please try again.</span><button type="button" id="retry">Retry</button></div>
</form></div>
